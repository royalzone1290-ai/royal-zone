<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Zone | Competitive PUBG Mobile</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: rgba(18, 22, 29, 0.90);
            --accent: #f39c12;
            --accent-glow: rgba(243, 156, 18, 0.4);
            --text-main: #ffffff;
            --text-muted: #a0aab5;
            --border: rgba(255, 255, 255, 0.1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, rgba(20,25,35,0.8) 0%, rgba(10,12,15,0.95) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--accent);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }
        .toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .toggle-text span {
            color: var(--accent);
            cursor: pointer;
            font-weight: bold;
        }
        .admin-panel {
            display: none;
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        .logout-btn {
            background: #e74c3c;
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        .msg {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .msg.error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        .msg.success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول / إنشاء الحساب العام -->
    <div class="container" id="authContainer">
        <div class="logo">ROYAL ZONE</div>
        <div id="alertBox" class="msg"></div>
        
        <div id="loginForm">
            <div class="form-group">
                <label>اسم المستخدم أو البريد الإلكتروني</label>
                <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="handleLogin()">تسجيل الدخول</button>
            <div class="toggle-text">ليس لديك حساب؟ <span onclick="toggleMode()">إنشاء حساب جديد</span></div>
        </div>

        <div id="registerForm" style="display: none;">
            <div class="form-group">
                <label>اسم اللاعب (داخل اللعبة)</label>
                <input type="text" id="regName" placeholder="أدخل لقبك في PUBG">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="regEmail" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="regPass" placeholder="6 أحرف على الأقل">
            </div>
            <button class="btn" onclick="handleRegister()">إنشاء الحساب والانضمام</button>
            <div class="toggle-text">لديك حساب بالفعل؟ <span onclick="toggleMode()">تسجيل الدخول</span></div>
        </div>
    </div>

    <!-- لوحة تحكم المسؤول النهائية -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h2>لوحة تحكم المسؤول (Admin)</h2>
            <button class="logout-btn" onclick="handleLogout()">تسجيل الخروج</button>
        </div>
        <p>مرحباً بك يا أدمن. تم تحديث المنصة بنجاح وإلغاء شريط الإرشادات والحسابات التجريبية، والتسجيل العام متاح الآن للاعبين بكامل الكفاءة.</p>
    </div>

    <script>
        function toggleMode() {
            const loginF = document.getElementById('loginForm');
            const regF = document.getElementById('registerForm');
            if (loginF.style.display === 'none') {
                loginF.style.display = 'block';
                regF.style.display = 'none';
            } else {
                loginF.style.display = 'none';
                regF.style.display = 'block';
            }
            hideAlert();
        }

        function showAlert(text, type) {
            const box = document.getElementById('alertBox');
            box.innerText = text;
            box.className = `msg ${type}`;
            box.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if (user === 'ahmed1290' && pass === 'At126@#!') {
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else if (user === '' || pass === '') {
                showAlert('الرجاء ملء جميع الحقول المطلوبة', 'error');
            } else {
                showAlert('تم تسجيل الدخول بنجاح كلاعب!', 'success');
            }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if (!name || !email || !pass) {
                showAlert('الرجاء استكمال بيانات التسجيل العام', 'error');
                return;
            }
            showAlert('تم إنشاء الحساب بنجاح، ومرحباً بك في ساحة المعارك!', 'success');
        }

        function handleLogout() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            hideAlert();
        }
    </script>
</body>
</html>
